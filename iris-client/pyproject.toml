[project]
name = "iris-client"
version = "6.41.5"
description = "Async Python client for the Iris HTTP API (ADR-132)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
  { name = "Iris Contributors" },
]
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
  "datamodel-code-generator>=0.27",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.22",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
iris-client-regen = "iris_client.scripts.regen:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iris_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
