[project]
name = "iris-cli"
version = "0.2.0"
description = "Command-line interface for Iris (ADR-130)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
  "iris-client",
  "typer>=0.15",
  "rich>=13.9",
  "httpx>=0.28",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.22",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
iris = "iris_cli.main:app"

[tool.uv.sources]
# Path-relative so this resolves both in the uv workspace (dev) and when
# the whole repo is cloned by `uvx --from git+...#subdirectory=cli`.
iris-client = { path = "../iris-client" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iris_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
# Typer command bodies are inherently Any-returning glue; we care about the
# client library being strictly typed, not the CLI presentation layer.
warn_return_any = false
