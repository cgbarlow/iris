[project]
name = "iris-backend"
version = "6.17.7"
description = "Iris — Integrated Repository for Information & Systems"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "aiosqlite>=0.19.0",
    "argon2-cffi>=23.1.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "cairosvg>=2.8.2",
    "python-multipart>=0.0.22",
    "python-pptx>=1.0.2",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    # ADR-179, v6.2.0: markdown → docx/pdf renderer for the cascade
    # destination "Chat with downloadable artefacts" branch and the
    # POST /api/export/{diagram|markdown} endpoints. WeasyPrint requires
    # Pango / Cairo / GDK-PixBuf system libraries — verified at the
    # Phase 2 deploy gate per feedback_render_deploy_verification.
    "markdown-it-py>=4.0.0",
    "weasyprint>=68.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.22.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]
supabase = [
    "asyncpg==0.31.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "T20", "ICN", "PIE", "PT", "RSE", "RET", "SIM", "TID", "TCH", "ARG", "ERA", "PGH", "PL", "TRY", "FLY", "PERF", "RUF"]
ignore = ["S101", "TRY003", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "ARG001", "PLR2004", "PLC0415"]
# Export / tokens routers use FastAPI idioms that ruff flags spuriously:
#   B008 — Depends(...) in defaults; A002 — `format` query param shadows builtin;
#   TC001 — response models are used at runtime by Pydantic despite appearing
#   only in annotations in some helpers.
# PERF401 / S608 — markdown renderer builds text with append-in-loop; the SQL
# IN(?,?) placeholders are joined from a fixed `?` literal per element, never
# user input.
"app/export/**" = ["B008", "A002", "TC001", "PLC0415", "PERF401", "S608"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["jose.*", "aiosqlite.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
]
