[project]
name = "iris-workspace"
version = "0.0.0"
description = "Iris monorepo — workspace root for iris-client, iris-cli, iris-mcp"
requires-python = ">=3.12"

# Root project has no runtime dependencies; each workspace member owns its own.

[tool.uv.workspace]
# cli and mcp pull `iris-client` via a path source (`{ path = "../iris-client" }`)
# so the same dependency line works in dev *and* when uvx clones the repo for
# `git+...#subdirectory={cli,mcp}`. Listing iris-client as a workspace member
# would force `workspace = true`, which uvx can't resolve outside the workspace.
# iris-client is still pulled into the workspace .venv as a transitive dep.
# backend/ stays independent — it has its own established uv workflow.
members = ["cli", "mcp"]
