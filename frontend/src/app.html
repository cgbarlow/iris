<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!--
			Google Analytics 4 (gtag.js). The measurement ID is baked in at
			build time from PUBLIC_GA_MEASUREMENT_ID via
			%sveltekit.env.PUBLIC_GA_MEASUREMENT_ID% — SvelteKit only exposes
			env vars to app.html when they carry the PUBLIC_ prefix, so the
			Render env var must be named PUBLIC_GA_MEASUREMENT_ID (value e.g.
			`G-5B0T5HKVQ9`). Set it per environment in the Render dashboard.
			The guard means analytics only load when a real `G-…` ID is
			present, so local dev and PR previews (where the var is unset,
			leaving an empty string) neither fire tracking nor make broken
			requests. One measurement ID covers the whole SPA — a GA4 web
			stream maps to the site/domain, not to each Render service.
		-->
		<script>
			(function () {
				var id = '%sveltekit.env.PUBLIC_GA_MEASUREMENT_ID%';
				if (!id || id.indexOf('G-') !== 0) return;
				window.dataLayer = window.dataLayer || [];
				function gtag() { dataLayer.push(arguments); }
				window.gtag = gtag;
				gtag('js', new Date());
				gtag('config', id);
				var s = document.createElement('script');
				s.async = true;
				s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
				document.head.appendChild(s);
			})();
		</script>

		<!--
			Open Graph + Twitter Card metadata (ADR-126). These tags must live
			in app.html (not in a <svelte:head> block) because Iris ships as
			a static SPA (adapter-static / fallback: 'index.html'); social
			scrapers like LinkedIn / Slack / Teams / WhatsApp do not execute
			JS, so they only ever see what's in the shell HTML. Tags are
			pre-templated at build time via %sveltekit.env.PUBLIC_SITE_URL%
			— set PUBLIC_SITE_URL in the deploy environment (e.g.
			`https://iris-uat.chrisbarlow.nz`); falls back to a relative path
			when unset so local dev still has a coherent preview.
		-->
		<meta name="description" content="Browse, search, and explore a living architecture knowledge graph: collections, sets, packages, diagrams, elements, and the relationships between them — with an AI assistant on hand." />

		<meta property="og:title" content="Iris — Integrated Repository for Information & Systems" />
		<meta property="og:description" content="Browse, search, and explore a living architecture knowledge graph: collections, sets, packages, diagrams, elements, and the relationships between them — with an AI assistant on hand." />
		<meta property="og:image" content="%sveltekit.env.PUBLIC_SITE_URL%/iris-preview.png" />
		<meta property="og:url" content="%sveltekit.env.PUBLIC_SITE_URL%" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Iris" />

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Iris — Integrated Repository for Information & Systems" />
		<meta name="twitter:description" content="Browse, search, and explore a living architecture knowledge graph: collections, sets, packages, diagrams, elements, and the relationships between them — with an AI assistant on hand." />
		<meta name="twitter:image" content="%sveltekit.env.PUBLIC_SITE_URL%/iris-preview.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
